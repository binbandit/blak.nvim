name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Static validation
        run: make validate

  smoke:
    name: Smoke (${{ matrix.neovim }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@v7
      - name: Install Neovim
        env:
          NVIM_RELEASE: ${{ matrix.neovim }}
        run: |
          curl -fsSL -o nvim.tar.gz "https://github.com/neovim/neovim-releases/releases/download/$NVIM_RELEASE/nvim-linux-x86_64.tar.gz"
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Show Neovim version
        run: nvim --version | head -n 3
      - name: Runtime smoke test
        run: make smoke
      - name: Installer smoke test
        if: matrix.neovim == 'stable'
        run: make smoke-install
